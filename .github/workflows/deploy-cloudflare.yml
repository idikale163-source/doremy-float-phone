name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'styles/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Next.js with next-on-pages
        env:
          NEXT_PUBLIC_SELF_HOSTED_MODE: 'true'
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          node scripts/build-weixin-assistant-dist.mjs || true
          node scripts/build-personal-push-dist.mjs || true
          npx @cloudflare/next-on-pages --experimental-minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=doremy-float-phone --branch=main --commit-dirty=true
